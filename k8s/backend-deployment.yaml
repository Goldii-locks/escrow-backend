apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: milestone
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: milestone
    app.kubernetes.io/component: backend
spec:
  # One replica only: the indexer poller runs inside the API process and the
  # SQLite database cannot be shared by two pods.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: milestone
        app.kubernetes.io/component: backend
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: milestone-backend:0.1.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: API_KEYS
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: API_KEYS
            - name: ADMIN_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: ADMIN_API_KEYS
            - name: PUSH_NOTIFICATION_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: PUSH_NOTIFICATION_SECRET
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /ready
              port: 3001
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 3001
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: backend-data
        - name: tmp
          emptyDir: {}
