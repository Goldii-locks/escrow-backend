openapi: 3.0.3
info:
  title: Milestone Escrow Backend API
  version: 1.0.0
  description: >-
    Express + TypeScript backend for the Soroban milestone escrow platform.
    Provides API endpoints for job querying, transaction building, transaction submission,
    indexer health, and event webhook subscriptions.
    Every /api/* path below is also mounted under the /api/v1 server prefix;
    requests using the unversioned /api/* prefix receive `Deprecation: true`
    (#697). Liveness is /health, readiness (SQLite + poller + ledger lag) is
    /ready.
servers:
  - url: http://localhost:3001
    description: Local development server
  - url: /api/v1
    description: Modern versioned base path
  - url: /api
    description: "Legacy compatibility base path (returns Deprecation: true)"

components:
  headers:
    Deprecation:
      description: Present on every unversioned /api/* response to point clients at /api/v1.
      schema:
        type: string
        example: "true"

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: API key required for client requests when API_KEYS is enforced.
    AdminApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Admin API key required for administrative and indexer monitoring endpoints (ADMIN_API_KEYS). Bearer token also supported.

  schemas:
    HistoryEvent:
      type: object
      description: A parsed history event; internal DB columns are not exposed (#931).
      properties:
        eventId:
          type: string
          nullable: true
        eventType:
          type: string
        ledger:
          type: integer
        timestamp:
          type: integer
          nullable: true
        txHash:
          type: string
          nullable: true
        data:
          nullable: true
          description: Parsed event payload, or null when it is not valid JSON.

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        contract:
          type: string
          example: CARZQMYKDGA4TTIE2XBDJ42EX27VYLLJGGG4WGUIXXWIVHPDTX3UCLJA
        version:
          type: string
          nullable: true
          description: GIT_SHA baked into the running image (#894).
          example: 6d06868b1a2b3c4d5e6f708192a3b4c5d6e7f809

    ReadinessResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        lastIndexedLedger:
          type: integer
          nullable: true
        lastSuccessfulPollAgeMs:
          type: integer
          nullable: true
        ledgerLag:
          type: integer
          nullable: true
          description: Chain head minus the last stored ledger observed by the last poll (#893).
        failingCheck:
          type: string
          enum: [database, poller, ledgerLag]

    ApiError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: Invalid contractId provided

    ValidationError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: Request validation failed
        fields:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    JobMilestone:
      type: object
      properties:
        description:
          type: string
        amount:
          type: string
        releasedAmount:
          type: string
          description: Amount already released (stroops), useful for PartiallyReleased milestones.
        status:
          type: string
        approved:
          type: boolean
        deliveredAt:
          type: integer
          description: Ledger timestamp (seconds) of delivery; 0 when not delivered.
        funded:
          type: boolean
        specHash:
          type: string
          nullable: true
          description: Committed spec hash as lowercase hex; null when unset (all zeroes).
        deliverable:
          type: string
          nullable: true
          description: Deliverable hash as lowercase hex; null when unset (all zeroes).

    JobState:
      type: object
      properties:
        contractId:
          type: string
        client:
          type: string
        freelancer:
          type: string
        arbiter:
          type: string
        token:
          type: string
        funded:
          type: boolean
        milestones:
          type: array
          items:
            $ref: '#/components/schemas/JobMilestone'
        autoReleaseSeconds:
          type: integer
          description: Seconds after deliveredAt before a milestone can be auto-released.

    JobDraft:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          example: draft
        client:
          type: string
        freelancer:
          type: string
        arbiter:
          type: string
        token:
          type: string
        autoReleaseDays:
          type: integer
        milestones:
          type: array
          items:
            type: object

    IndexerStatus:
      type: object
      properties:
        success:
          type: boolean
          example: true
        lastIndexedLedger:
          type: integer
        totalEvents:
          type: integer
        uptimeSeconds:
          type: number
        lastEventAt:
          type: string
          nullable: true
        eventsByType:
          type: object
        reconciliation:
          type: object

paths:
  /health:
    get:
      summary: Liveness probe
      description: Returns health status, configured contract ID and the running GIT_SHA (#894).
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /ready:
    get:
      summary: Readiness probe
      description: >
        Unauthenticated. 200 only when SQLite answers, the last successful poll
        is recent and the ledger lag observed by that poll is within
        READY_MAX_LEDGER_LAG; otherwise 503 with the failing check (#622, #893).
      responses:
        '200':
          description: Ready to serve indexed data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: Not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'

  /api/jobs/by-wallet/{address}:
    get:
      summary: Query jobs by wallet address
      description: Returns indexed jobs where the address participates as client, freelancer, or arbiter. Public read-only.
      parameters:
        - name: address
          in: path
          required: true
          description: Stellar account address (G... 56 chars)
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: role
          in: query
          required: false
          description: Only jobs where this wallet holds the given role.
          schema:
            type: string
            enum: [client, freelancer, arbiter]
        - name: state
          in: query
          required: false
          description: >
            open (default semantics) means the job's latest indexed event is not
            terminal; closed means the latest indexed event is one of the
            terminal outcomes: adminexc, adtxrfd, adtxrls, arbsplit, cancel,
            cxlappr, cxlspref, msadmref, msadmrel, resolve, sprefnet, splitref,
            sweep, twspltref, unaccref, withdraw.
          schema:
            type: string
            enum: [open, closed]
      responses:
        '200':
          description: List of jobs for wallet
        '400':
          description: Invalid address or pagination parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Rate limit exceeded (BY_WALLET_RATE_LIMIT_MAX)

  /api/wallets/{address}/activity:
    get:
      summary: Query activity notifications for wallet address
      description: Returns activity notifications for contracts the address participates in. Public read-only.
      parameters:
        - name: address
          in: path
          required: true
          description: Stellar account address (G... 56 chars)
          schema:
            type: string
        - name: since
          in: query
          required: false
          description: Keyset pagination cursor on events.id
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          description: Maximum items to return (1-100, default 50)
          schema:
            type: integer
            default: 50
            maximum: 100
      responses:
        '200':
          description: Activity notification feed for wallet
        '400':
          description: Invalid address or query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Rate limit exceeded (BY_WALLET_RATE_LIMIT_MAX)

  /api/jobs/create-job-draft:
    post:
      summary: Create off-chain job draft
      description: Validates and creates a draft escrow configuration before on-chain deployment. Public endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - client
                - freelancer
                - arbiter
                - token
                - milestones
              properties:
                client:
                  type: string
                  description: Stellar G... address
                freelancer:
                  type: string
                  description: Stellar G... address
                arbiter:
                  type: string
                  description: Stellar G... address
                token:
                  type: string
                  description: Soroban C... token contract address
                autoReleaseDays:
                  type: integer
                  default: 7
                milestones:
                  type: array
                  items:
                    type: object
                    required:
                      - amount
                    properties:
                      description:
                        type: string
                      amount:
                        type: string
      responses:
        '201':
          description: Draft created successfully
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: Rate limit exceeded (CREATE_JOB_DRAFT_RATE_MAX)

  /api/jobs/drafts/{id}:
    get:
      summary: Fetch a persisted job draft
      description: Returns an off-chain draft created by POST /api/jobs/create-job-draft (#667).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The stored draft payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDraft'
        '404':
          description: Draft not found
        '500':
          description: Draft store unavailable

  /api/jobs/query:
    get:
      summary: Read-only contract state query
      description: Simulates read-only methods on a contract.
      parameters:
        - name: contractId
          in: query
          required: true
          schema:
            type: string
        - name: method
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Query simulation result
        '400':
          description: Invalid contractId or method
    post:
      summary: Read-only contract state query
      description: Simulates read-only methods on a contract with body parameters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - contractId
                - method
              properties:
                contractId:
                  type: string
                method:
                  type: string
                args:
                  type: array
                  items:
                    type: object
      responses:
        '200':
          description: Query simulation result
        '400':
          description: Invalid parameters

  /api/jobs/whitelisted-tokens:
    get:
      summary: Whitelisted tokens query alias
      description: Alias query param route that forwards to /:contractId/whitelist.
      parameters:
        - name: contractId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of whitelisted token contract IDs
        '400':
          description: Missing or invalid contractId

  /api/jobs/{contractId}/history:
    get:
      summary: Job event history
      description: >
        Returns an indexed event timeline for an escrow contract. Public
        read-only. Newest-first by default on /api/v1, oldest-first on the
        legacy /api path. Keyset cursors keep paging stable as new events
        arrive (#931, #932).
      parameters:
        - name: contractId
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
        - name: before
          in: query
          required: false
          description: Return rows before this event row id in the current order.
          schema:
            type: integer
        - name: after
          in: query
          required: false
          description: Return rows after this event row id in the current order.
          schema:
            type: integer
        - name: includeTotal
          in: query
          required: false
          description: Opt in to the expensive COUNT(*) used for `total`.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Event history result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      events:
                        type: array
                        items:
                          $ref: '#/components/schemas/HistoryEvent'
                      page:
                        type: integer
                      limit:
                        type: integer
                      nextCursor:
                        type: string
                        nullable: true
                      total:
                        type: integer
                        description: Present only when includeTotal=true.
        '400':
          description: Invalid contractId or pagination

  /api/jobs/{contractId}/history.csv:
    get:
      summary: Job event history as CSV
      description: Same indexed event timeline as /history, serialised as CSV for spreadsheets.
      parameters:
        - name: contractId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: CSV event history
          content:
            text/csv:
              schema:
                type: string
        '400':
          description: Invalid contractId or pagination

  /api/jobs/{contractId}/fee-preview:
    get:
      summary: Preview platform fee calculation
      description: Computes platform fee breakdown for a milestone or contract amount.
      parameters:
        - name: contractId
          in: path
          required: true
          schema:
            type: string
        - name: amount
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Fee preview breakdown
        '400':
          description: Invalid parameters

  /api/jobs/{contractId}:
    get:
      summary: Fetch job state
      description: Simulates get_job against the Soroban contract to return live escrow state. Public read-only.
      parameters:
        - name: contractId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobState'
        '400':
          description: Invalid contractId
        '404':
          description: Job not found
        '429':
          description: Rate limit exceeded (JOB_CONTRACT_RATE_MAX)

  /api/jobs/{contractId}/whitelist:
    get:
      summary: Get whitelisted tokens for contract
      description: Queries whitelisted payment tokens accepted by the escrow contract.
      parameters:
        - name: contractId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Whitelisted tokens list
        '400':
          description: Invalid contractId
        '429':
          description: Rate limit exceeded (JOB_WHITELIST_RATE_MAX)

  /api/jobs/{contractId}/whitelist/update:
    post:
      summary: Build whitelist update transaction
      description: Builds unsigned transaction XDR for adding or removing whitelisted tokens.
      parameters:
        - name: contractId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                action:
                  type: string
                  enum: [add, remove]
                adminAddress:
                  type: string
                addresses:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Unsigned transaction XDR or updated list
        '400':
          description: Invalid contractId or body
        '429':
          description: Rate limit exceeded (JOB_WHITELIST_UPDATE_RATE_MAX)

  /api/jobs/build-tx:
    post:
      summary: Build unsigned Soroban transaction
      description: Builds an unsigned transaction XDR for authorized contract entrypoints for the caller's wallet to sign.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - contractId
                - method
                - sourceAddress
              properties:
                contractId:
                  type: string
                method:
                  type: string
                args:
                  type: array
                  items:
                    type: object
                sourceAddress:
                  type: string
      responses:
        '200':
          description: Transaction XDR built
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      xdr:
                        type: string
        '400':
          description: Invalid parameters or disallowed method
        '429':
          description: Rate limit exceeded (BUILD_TX_RATE_MAX)

  /api/jobs/{contractId}/milestones/{index}/partial-release:
    post:
      summary: Build partial milestone release transaction
      description: Builds unsigned transaction XDR for partial milestone release.
      parameters:
        - name: contractId
          in: path
          required: true
          schema:
            type: string
        - name: index
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
                - sourceAddress
              properties:
                amount:
                  type: string
                sourceAddress:
                  type: string
      responses:
        '200':
          description: Unsigned transaction XDR
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      xdr:
                        type: string
        '400':
          description: Validation error
        '429':
          description: Rate limit exceeded (PARTIAL_RELEASE_RATE_MAX)

  /api/jobs/{contractId}/milestones/{index}/time-remaining:
    get:
      summary: Time remaining until milestone auto-release
      description: Queries the remaining seconds until milestone auto-release eligibility.
      parameters:
        - name: contractId
          in: path
          required: true
          schema:
            type: string
        - name: index
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Remaining seconds
        '400':
          description: Invalid parameters
        '429':
          description: Rate limit exceeded (TIME_REMAINING_RATE_MAX)

  /api/jobs/{contractId}/milestones/{index}/auto-release:
    get:
      summary: Time remaining until milestone auto-release (alias)
      description: Alias for /time-remaining. Queries the remaining seconds until milestone auto-release eligibility.
      parameters:
        - name: contractId
          in: path
          required: true
          schema:
            type: string
        - name: index
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Remaining seconds
        '400':
          description: Invalid parameters
        '429':
          description: Rate limit exceeded (TIME_REMAINING_RATE_MAX)

  /api/jobs/{contractId}/milestones/{index}/claim-auto-release:
    post:
      summary: Build claim auto-release transaction
      description: Builds unsigned transaction XDR for claiming an auto-released milestone.
      parameters:
        - name: contractId
          in: path
          required: true
          schema:
            type: string
        - name: index
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sourceAddress
              properties:
                sourceAddress:
                  type: string
      responses:
        '200':
          description: Unsigned transaction XDR
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      xdr:
                        type: string
        '400':
          description: Validation error
        '429':
          description: Rate limit exceeded (CLAIM_AUTO_RELEASE_RATE_MAX)

  /api/jobs/submit:
    post:
      summary: Submit signed transaction
      description: Submits a signed transaction XDR to the Stellar / Soroban network.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - signedXdr
              properties:
                signedXdr:
                  type: string
                sourceAddress:
                  type: string
      responses:
        '200':
          description: Transaction submitted result
        '400':
          description: Invalid transaction payload
        '429':
          description: Rate limit exceeded (SUBMIT_RATE_MAX)

  /api/jobs/tx/{hash}:
    get:
      summary: Get submitted transaction status
      description: |
        Looks up a transaction submitted via /api/jobs/submit. Poll until the
        status is SUCCESS or FAILED; NOT_FOUND means it is still pending (or
        unknown). Terminal states are cached for 60 seconds.

        Polling example:
        ```js
        let data;
        do {
          await new Promise((r) => setTimeout(r, 2000));
          ({ data } = await (await fetch(`/api/jobs/tx/${hash}`)).json());
        } while (data.status === "NOT_FOUND");
        ```
      parameters:
        - name: hash
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{64}$'
      responses:
        '200':
          description: Transaction status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum: [NOT_FOUND, SUCCESS, FAILED]
                      ledger:
                        type: integer
                        nullable: true
                      createdAt:
                        type: integer
                        nullable: true
                      resultCode:
                        type: string
                        nullable: true
                      error:
                        type: string
                        description: Client-safe failure reason, only for FAILED.
        '400':
          description: Invalid transaction hash
        '429':
          description: Rate limit exceeded (JOB_CONTRACT_RATE_MAX)

  /api/admin/indexer-status:
    get:
      summary: Get indexer and reconciliation status
      description: Administrative status of the indexer poller, database, and reconciliation engine.
      security:
        - AdminApiKeyAuth: []
      responses:
        '200':
          description: Indexer status data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexerStatus'
        '401':
          description: Unauthorized (missing or invalid admin API key)

  /api/admin/undecodable-events/retry:
    post:
      summary: Retry undecodable events after a decoder fix
      description: >
        Re-decodes events parked in undecodable_events with the current decoder,
        inserts the recovered ones through the normal event path (participants,
        cache invalidation and webhooks), and deletes them from the table (#933).
      security:
        - AdminApiKeyAuth: []
      responses:
        '200':
          description: Retry result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  retried:
                    type: integer
                  recovered:
                    type: integer
                  stillFailing:
                    type: integer
        '401':
          description: Unauthorized (missing or invalid admin API key)
        '500':
          description: Retry could not be completed

  /api/admin/metrics:
    get:
      summary: Indexer metrics snapshot
      description: Current indexer metrics from the indexer metrics collector.
      security:
        - AdminApiKeyAuth: []
      responses:
        '200':
          description: Metrics snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  metrics:
                    type: object
        '401':
          description: Unauthorized (missing or invalid admin API key)
        '500':
          description: Metrics could not be collected

  /api/admin/jobs:
    get:
      summary: List monitored jobs for the admin dashboard
      description: >
        Monitored jobs joined with their participants, latest event and
        whether any milestone has an open dispute, newest activity first,
        with cursor pagination (#961).
      security:
        - AdminApiKeyAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [disputed, active, completed]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: The `nextCursor` value from the previous page.
          schema:
            type: string
      responses:
        '200':
          description: A page of jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  jobs:
                    type: array
                    items:
                      type: object
                      properties:
                        contractId: { type: string }
                        client: { type: string, nullable: true }
                        freelancer: { type: string, nullable: true }
                        arbiter: { type: string, nullable: true }
                        latestEventType: { type: string }
                        latestLedger: { type: integer }
                        hasOpenDispute: { type: boolean }
                  nextCursor:
                    type: string
                    nullable: true
        '400':
          description: Unknown status filter
        '401':
          description: Unauthorized (missing or invalid admin API key)
        '500':
          description: Jobs could not be listed

  /api/admin/webhook-subscriptions:
    get:
      summary: List webhook subscriptions, including auto-disabled ones
      description: >
        Every webhook subscription, split into `active` and `disabled`. A
        subscription is disabled after WEBHOOK_DISABLE_AFTER consecutive
        failed deliveries and re-enabled by subscribing again (#701).
      security:
        - AdminApiKeyAuth: []
      responses:
        '200':
          description: Subscriptions grouped by state
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  subscriptions:
                    type: array
                    items:
                      type: object
                  active:
                    type: array
                    items:
                      type: object
                  disabled:
                    type: array
                    items:
                      type: object
        '401':
          description: Unauthorized (missing or invalid admin API key)

  /api/admin/webhook-subscriptions/{id}/deliveries:
    get:
      summary: Inspect a webhook subscription delivery history
      description: >
        Delivery attempts for one subscription, newest first, joined to the
        event they carry. Each row includes the deterministic
        `X-Milesto-Delivery-Id` value as `deliveryId`. The subscription
        webhook URL has its query string masked. Paginate by passing
        `nextBefore` as `before` (#941).
      security:
        - AdminApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, delivered, failed, dead]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: before
          in: query
          description: Return only deliveries with an id lower than this (keyset cursor)
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Deliveries, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  subscription:
                    type: object
                  deliveries:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        deliveryId:
                          type: string
                          format: uuid
                        status:
                          type: string
                        attempts:
                          type: integer
                        lastError:
                          type: string
                          nullable: true
                        nextAttemptAt:
                          type: integer
                          nullable: true
                        updatedAt:
                          type: string
                          nullable: true
                        eventType:
                          type: string
                          nullable: true
                        ledgerSequence:
                          type: integer
                          nullable: true
                        eventId:
                          type: string
                          nullable: true
                  nextBefore:
                    type: integer
                    nullable: true
        '400':
          description: Invalid status, limit or before
        '401':
          description: Unauthorized (missing or invalid admin API key)
        '404':
          description: Unknown webhook subscription

  /api/admin/backfill:
    post:
      summary: Start a historical ledger backfill
      description: Imports an inclusive ledger range in the background (#703). One backfill runs at a time.
      security:
        - AdminApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startLedger, endLedger]
              properties:
                startLedger:
                  type: integer
                endLedger:
                  type: integer
                contractId:
                  type: string
                  description: Limit the import to one contract
      responses:
        '202':
          description: Backfill started; the body carries the job ID
        '400':
          description: Invalid ledger range
        '401':
          description: Unauthorized (missing or invalid admin API key)
        '409':
          description: A backfill is already running
    get:
      summary: Get backfill status
      description: Status of the current or last backfill (running, done or failed, with event counts), or idle.
      security:
        - AdminApiKeyAuth: []
      responses:
        '200':
          description: Backfill status
        '401':
          description: Unauthorized (missing or invalid admin API key)

  /api/admin/contracts:
    get:
      summary: List monitored contracts
      description: Contracts the indexer monitors (#659).
      security:
        - AdminApiKeyAuth: []
      responses:
        '200':
          description: Monitored contracts
        '401':
          description: Unauthorized (missing or invalid admin API key)
    post:
      summary: Register a contract for indexing
      security:
        - AdminApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contractId]
              properties:
                contractId:
                  type: string
                label:
                  type: string
                startLedger:
                  type: integer
                  minimum: 0
      responses:
        '201':
          description: Contract registered
        '400':
          description: Validation error
        '401':
          description: Unauthorized (missing or invalid admin API key)

  /api/admin/contracts/{contractId}:
    delete:
      summary: Deregister a monitored contract
      security:
        - AdminApiKeyAuth: []
      parameters:
        - name: contractId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Contract deregistered
        '401':
          description: Unauthorized (missing or invalid admin API key)

  /api/webhooks/subscribe:
    post:
      summary: Subscribe to escrow contract webhook notifications
      description: Registers a webhook URL to receive notifications for contract events.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - contract_id
                - webhook_url
              properties:
                contract_id:
                  type: string
                webhook_url:
                  type: string
                event_types:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Subscription created successfully
        '400':
          description: Validation error

  /api/webhooks/unsubscribe:
    post:
      summary: Unsubscribe from escrow contract webhook notifications
      description: Removes an existing webhook subscription.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - contract_id
                - webhook_url
              properties:
                contract_id:
                  type: string
                webhook_url:
                  type: string
      responses:
        '200':
          description: Unsubscribed successfully
        '400':
          description: Validation error

  /api/webhooks/test:
    post:
      summary: Send a test ping to a webhook endpoint
      description: Admin-only. Delivers a synthetic event to the given URL without creating a delivery row or touching subscription failure counters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - contract_id
                - webhook_url
              properties:
                contract_id:
                  type: string
                webhook_url:
                  type: string
      responses:
        '200':
          description: Test ping result
        '400':
          description: Validation error
        '401':
          description: Missing or invalid admin key
        '429':
          description: Rate limit exceeded

  /api/admin/webhook-deliveries/replay:
    post:
      summary: Replay dead webhook deliveries
      description: Admin-only. Resets dead (or matching) webhook deliveries so the retry sweep picks them up again.
      responses:
        '200':
          description: Deliveries reset for replay
        '400':
          description: Validation error
        '401':
          description: Missing or invalid admin key

  /api/admin/audit-log:
    get:
      summary: List admin audit log entries
      description: Admin-only. Returns recorded administrative actions, newest first.
      responses:
        '200':
          description: Audit log entries
        '401':
          description: Missing or invalid admin key

  /api/webhooks/subscriptions:
    get:
      summary: List webhook subscriptions for a contract
      description: Webhook URL query strings are masked in the response (#705).
      security:
        - ApiKeyAuth: []
      parameters:
        - name: contract_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Subscriptions for the contract
        '400':
          description: contract_id is missing
        '401':
          description: Unauthorized (missing or invalid API key)

  /api/tokens/{contractId}:
    get:
      summary: Resolve SEP-41 token metadata
      description: >
        Returns the cached on-chain symbol, name and decimals for a token
        contract, so clients can format raw i128 amounts. Public read-only;
        success responses are cacheable for one hour.
      parameters:
        - name: contractId
          in: path
          required: true
          description: Stellar token contract address (C... 56 chars)
          schema:
            type: string
      responses:
        '200':
          description: Resolved token metadata
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=3600
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      contractId:
                        type: string
                      symbol:
                        type: string
                        description: Empty when the contract has no symbol().
                      name:
                        type: string
                      decimals:
                        type: integer
                        minimum: 0
                        maximum: 18
                      label:
                        type: string
                        description: Human-readable display label for the symbol.
        '400':
          description: Invalid contract id
        '404':
          description: Contract does not implement the token interface
        '429':
          description: Rate limit exceeded

  /api/stats:
    get:
      summary: Platform statistics
      description: Aggregate indexed job and event counts for the admin dashboard.
      responses:
        '200':
          description: Statistics snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  stats:
                    type: object
  /api/client-errors:
    post:
      summary: Report frontend error
      description: Ingests scrubbed browser client errors for monitoring. Accepted reports return 204.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, message]
              properties:
                source:
                  type: string
                  enum: [api, tx, render, unhandled]
                message:
                  type: string
                  maxLength: 500
                route:
                  type: string
                status:
                  type: integer
                  minimum: 100
                  maximum: 599
                requestId:
                  type: string
      responses:
        '204':
          description: Client error report accepted
        '400':
          description: Invalid error report or payload exceeds 4 kB limit
        '429':
          description: Rate limit exceeded

  /api/csp-report:
    post:
      summary: Content Security Policy violation report
      description: Ingests CSP violation reports in application/csp-report or application/reports+json format.
      requestBody:
        required: true
        content:
          application/csp-report:
            schema:
              type: object
          application/reports+json:
            schema:
              type: array
              items:
                type: object
      responses:
        '204':
          description: CSP report accepted
        '400':
          description: Malformed JSON or payload exceeds 8 kB limit
        '429':
          description: Rate limit exceeded

  /api/disputes/{disputeId}:
    get:
      summary: Get dispute state for a milestone
      description: Retrieves dispute state using get_dispute_info, milestone info, and party addresses.
      parameters:
        - name: disputeId
          in: path
          required: true
          description: "Dispute identifier formatted as <contractId>:<milestoneIndex>"
          schema:
            type: string
            example: "CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC:0"
      responses:
        '200':
          description: Dispute state retrieved successfully
        '400':
          description: Invalid dispute ID format
        '404':
          description: Milestone has never been disputed or dispute not found
        '429':
          description: Rate limit exceeded

  /api/disputes/{disputeId}/history:
    get:
      summary: Get dispute event timeline for a milestone
      description: Retrieves chronological timeline of dispute events for the requested milestone.
      parameters:
        - name: disputeId
          in: path
          required: true
          schema:
            type: string
            example: "CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC:0"
      responses:
        '200':
          description: Dispute event history retrieved successfully
        '400':
          description: Invalid dispute ID format
        '404':
          description: Milestone has never been disputed
        '429':
          description: Rate limit exceeded

  /api/disputes/{disputeId}/evidence:
    get:
      summary: Get dispute evidence events for a milestone
      description: Retrieves evidence submission events for the requested milestone.
      parameters:
        - name: disputeId
          in: path
          required: true
          schema:
            type: string
            example: "CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC:0"
      responses:
        '200':
          description: Dispute evidence list retrieved successfully
        '400':
          description: Invalid dispute ID format
        '404':
          description: Milestone has never been disputed
        '429':
          description: Rate limit exceeded
