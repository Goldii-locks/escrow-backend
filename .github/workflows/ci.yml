name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        # High/critical advisories in production dependencies fail the build,
        # except those listed with a reason in .audit-allowlist.json.
        run: node scripts/audit-gate.mjs

      - name: Architecture reachability table
        run: node scripts/reachability.mjs --check

      - name: Typed API client is up to date
        # clients/ts/schema.d.ts is generated from docs/openapi.yaml (#964).
        # Fail when the spec changed without `npm run gen:client`.
        run: |
          npm run gen:client
          if ! git diff --exit-code -- clients/ts; then
            echo "::error::clients/ts is out of date with docs/openapi.yaml. Run 'npm run gen:client' and commit the result."
            exit 1
          fi

      - name: Typed API client compiles
        run: npx tsc -p clients/ts

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test -- --coverage

      - name: Build
        run: npm run build
