name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        # High/critical advisories in production dependencies fail the build,
        # except those listed with a reason in .audit-allowlist.json.
        run: node scripts/audit-gate.mjs

      - name: Architecture reachability table
        run: node scripts/reachability.mjs --check

      - name: Lint
        run: npm run lint

      - name: Check .env.example matches src/ (#872)
        run: node scripts/check-env-example.mjs

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test -- --coverage

      - name: Build
        run: npm run build
