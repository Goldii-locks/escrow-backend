# .github/workflows/deploy.yml — escrow-backend
#
# Requires one repo secret: AWS_DEPLOY_ROLE_ARN
# No access keys. Auth is OIDC — GitHub mints a short-lived token, AWS
# trades it for temporary credentials. Nothing long-lived is stored.
#
# Trigger strategy (Issue 2)
# ─────────────────────────
# The workflow fires ONLY after the CI workflow completes on main AND its
# conclusion is "success".  This guarantees a push with failing tests can
# never produce an ECR image or execute an SSM deployment command.
#
# workflow_dispatch is preserved so engineers can re-deploy the current
# main HEAD without re-running CI (e.g. after an infra-only change on the
# server).  The CI-gate condition is skipped for manual triggers because
# the deployer is assumed to have verified correctness themselves.

name: Deploy to AWS

on:
  # Issue 2: gate on CI success instead of firing in parallel with it.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

  # Manual re-deploy without re-running CI.
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: af-south-1
  SERVICE: backend
  ECR_REPOSITORY: escrow-backend

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and push image
    # Issue 2: for workflow_run events only proceed when CI passed.
    # workflow_dispatch events have no workflow_run context, so the guard
    # evaluates to true and manual deploys are always allowed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      # Issue 2: checkout the exact commit that CI tested, not whatever
      # HEAD happens to be when this job starts.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: meta
        run: echo "tag=${GITHUB_SHA::12}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Roll out to EC2
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Send deploy command via SSM
        id: send
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Role,Values=escrow-prod" \
            --comment "deploy ${SERVICE} ${{ needs.build.outputs.image_tag }}" \
            --parameters "commands=[\"/opt/escrow/deploy.sh ${SERVICE} ${{ needs.build.outputs.image_tag }}\"]" \
            --query 'Command.CommandId' --output text)
          echo "command_id=${CMD_ID}" >> "$GITHUB_OUTPUT"
          echo "SSM command: ${CMD_ID}"

      - name: Wait for completion and print output
        run: |
          set -euo pipefail
          CMD_ID="${{ steps.send.outputs.command_id }}"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$CMD_ID" \
              --query 'CommandInvocations[0].Status' --output text)
            echo "attempt ${i}: ${STATUS}"
            case "$STATUS" in
              Success)   break ;;
              Failed|Cancelled|TimedOut)
                echo "::error::deploy finished with status ${STATUS}"
                break ;;
              *) sleep 5; continue ;;
            esac
          done

          aws ssm list-command-invocations \
            --command-id "$CMD_ID" --details \
            --query 'CommandInvocations[0].CommandPlugins[0].Output' \
            --output text

          [ "$STATUS" = "Success" ] || exit 1

      # ── Smoke tests (Issues 3 & 4) ─────────────────────────────────────────
      #
      # Two separate steps so the failure message clearly identifies which
      # layer is broken: nginx (frontend/healthz) or the backend process.
      #
      # All curl commands:
      #   • Use HTTPS to avoid 301 HTTP→HTTPS redirects being treated as success
      #   • Use -L to follow any remaining redirects within HTTPS
      #   • Use --fail-with-body so any HTTP 4xx/5xx exits non-zero and the
      #     response body is printed for diagnosis
      #   • Assert the exact response body where the contract is well-defined

      - name: Smoke test — nginx / frontend
        run: |
          set -euo pipefail
          BASE="https://${{ secrets.DEPLOY_HOST }}"

          for i in $(seq 1 12); do
            if curl --fail-with-body -sS -L --max-time 5 "${BASE}/healthz" >/dev/null 2>&1; then
              echo "nginx healthy"
              break
            fi
            echo "waiting for nginx... (${i}/12)"; sleep 5
          done

          # Final assertion — exits non-zero on any HTTP error.
          curl --fail-with-body -sS -L --max-time 5 "${BASE}/healthz"

      # Issue 3 & 4: backend /health is proxied through nginx to the Express
      # process.  nginx alone returning 200 on /healthz is not sufficient
      # evidence the backend booted successfully.  This step waits for the
      # backend to become available and asserts the exact JSON contract.
      - name: Smoke test — backend /health
        run: |
          set -euo pipefail
          BASE="https://${{ secrets.DEPLOY_HOST }}"

          # Poll for up to 90 s (18 × 5 s).  A backend container that crashed
          # on boot will never answer this endpoint so the step fails hard.
          for i in $(seq 1 18); do
            RESPONSE=$(curl --fail-with-body -sS -L --max-time 10 \
              "${BASE}/health" 2>/dev/null || true)
            if echo "${RESPONSE}" | grep -q '"status":"ok"'; then
              echo "backend healthy: ${RESPONSE}"
              exit 0
            fi
            echo "waiting for backend... (${i}/18)  response=${RESPONSE}"
            sleep 5
          done

          echo "::error::backend /health never returned {\"status\":\"ok\"} within 90 s"
          exit 1
