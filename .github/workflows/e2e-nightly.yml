name: E2E (nightly)

# Opt-in Soroban integration suite (#684): builds the escrow contract, runs it
# on a local stellar/quickstart network, and drives the backend end to end.
on:
  workflow_dispatch:
    inputs:
      contract_ref:
        description: "escrow-contract git ref to build"
        required: false
        default: "main"
      force_failure:
        description: "Fail the run on purpose to exercise the e2e-nightly issue reporting"
        type: boolean
        required: false
        default: false
  schedule:
    # Nightly at 04:00 UTC, an hour after escrow-contract's own E2E run.
    - cron: "0 4 * * *"

permissions:
  contents: read
  issues: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check out escrow-contract
        uses: actions/checkout@v4
        with:
          repository: Goldii-locks/escrow-contract
          ref: ${{ inputs.contract_ref || 'main' }}
          path: escrow-contract

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32v1-none

      # soroban-sdk refuses plain `cargo build` for contracts; it has to be
      # `stellar contract build`. Same version as escrow-contract's E2E.
      - name: Install stellar-cli
        uses: stellar/stellar-cli@v30.0.1

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            escrow-contract/target
          key: ${{ runner.os }}-e2e-cargo-${{ hashFiles('escrow-contract/**/Cargo.lock') }}

      - name: Build escrow and escrow-factory Wasm
        working-directory: escrow-contract
        run: |
          stellar contract build --manifest-path contracts/milestone-escrow/Cargo.toml
          stellar contract build --manifest-path contracts/escrow-factory/Cargo.toml

      - name: Start Stellar quickstart
        run: |
          docker run -d --rm --name escrow-backend-e2e-quickstart -p 8000:8000 \
            "$E2E_QUICKSTART_IMAGE" --local --enable-soroban-rpc --limits unlimited
        env:
          # Pinned like escrow-contract's scripts/e2e.sh, and the escrow Wasm
          # exceeds the default contract size limit, hence --limits.
          E2E_QUICKSTART_IMAGE: stellar/quickstart:v678-b1525.1-latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Forced failure (test hook)
        if: inputs.force_failure
        run: |
          echo "force_failure input set; failing on purpose" >&2
          exit 1

      - name: Run E2E suite
        run: npm run test:e2e
        env:
          ESCROW_WASM_PATH: escrow-contract/target/wasm32v1-none/release/milestone_escrow.wasm
          FACTORY_WASM_PATH: escrow-contract/target/wasm32v1-none/release/escrow_factory.wasm

      - name: Quickstart logs on failure
        if: failure()
        run: docker logs escrow-backend-e2e-quickstart 2>&1 | tail -n 300

      - name: Stop Stellar quickstart
        if: always()
        run: docker stop escrow-backend-e2e-quickstart || true

      # Scheduled runs are the only drift detector, so a red run must not go
      # unnoticed (#939): keep exactly one open e2e-nightly issue, comment on it
      # for repeat failures, and close it on the next green run. A manual run
      # with force_failure exercises the same path.
      - name: Open or update e2e-nightly issue
        if: failure() && (github.event_name == 'schedule' || inputs.force_failure)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create e2e-nightly --color B60205 \
            --description "Nightly E2E run is failing" 2>/dev/null || true
          existing="$(gh issue list --label e2e-nightly --state open --limit 1 \
            --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Nightly E2E failed again: $RUN_URL"
          else
            gh issue create --label e2e-nightly \
              --title "Nightly E2E run is failing" \
              --body "The nightly E2E run failed: $RUN_URL. This usually means contract/backend drift (a renamed method or a changed event shape). This issue closes automatically on the next green run."
          fi

      - name: Close e2e-nightly issue on success
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --label e2e-nightly --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Nightly E2E is green again: $RUN_URL"
          done
